# Modèle pour UN client. Remplace app = "..." par un nom unique, ex. "subs-client1".
app = "subs-client1"
primary_region = "cdg"

[build]

[env]
  # Les clés (DEEPGRAM_API_KEY, GEMINI_API_KEY, ACCESS_TOKEN, ADMIN_TOKEN) sont des
  # "secrets" (voir DEPLOY.md), jamais écrites ici.
  ASR_LANGUAGE = "ar"
  TARGET_LANGUAGE = "fr"
  TRANSLATION_PROVIDER = "gemini"
  BUDGET_USD = "5"
  MIN_WORDS_INTERIM = "8"

[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
